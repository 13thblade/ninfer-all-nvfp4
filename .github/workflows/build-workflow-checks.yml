name: Build workflow checks

on:
  push:
    branches: ['build/**']
    paths:
      - '.github/scripts/**'
      - '.github/workflows/build-workflow-checks.yml'
      - 'tests/release/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/release -v
  windows-lifecycle:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/release -p test_build_lifecycle.py -v
