name: Preserve Actions caches in HF
on:
  push:
    branches: [build/windows-release]
    paths: ['.github/workflows/cache-migrate.yml']
  workflow_dispatch:
    inputs:
      caches:
        description: JSON include matrix with os, key and path for each existing cache
        required: true
        type: string
permissions:
  contents: read
jobs:
  preserve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.caches) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install huggingface_hub==1.17.0
      - uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.path }}
          key: ${{ matrix.key }}
          fail-on-cache-miss: true
      - name: Upload the preserved cache and verify its contents
        env:
          HF_TOKEN: ${{ secrets.HF_BUILD_CACHE_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          CACHE_PATH: ${{ matrix.path }}
          CACHE_KEY: ${{ matrix.key }}
        shell: bash
        run: |
          python .github/scripts/migrate-build-cache.py \
            --directory "$CACHE_PATH" --key "$CACHE_KEY"
      - uses: actions/upload-artifact@v7
        with:
          name: migrated-${{ matrix.key }}
          path: migration-result.json
