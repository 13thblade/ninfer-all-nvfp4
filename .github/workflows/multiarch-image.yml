# Package Native release's verified Linux CUDA 13 archive; do not compile it again.
name: Multi-architecture image

on:
  workflow_run:
    workflows: [Native release]
    types: [completed]
    branches: [master]

concurrency:
  group: multiarch-image
  cancel-in-progress: true

jobs:
  publish:
    name: Package the native Linux binaries
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check that the source is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
          echo "current=$([[ "$head" == "$SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.current.outputs.current == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v8
        if: steps.current.outputs.current == 'true'
        with:
          name: native-linux-cuda-13.4.3
          path: native-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v7
        if: steps.current.outputs.current == 'true'
        with:
          python-version: '3.11'
      - name: Verify and extract the Docker context
        if: steps.current.outputs.current == 'true'
        id: extract
        run: echo "context=$(python3.11 .github/scripts/extract-native-image.py native-artifact native-context "$SHA")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: steps.current.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        if: steps.current.outputs.current == 'true'
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:sha-${SHA:0:12}-multi"
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
          if [[ "$head" == "$SHA" ]]; then tags+=",$image:multi"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: steps.current.outputs.current == 'true'
      - uses: docker/build-push-action@v7
        if: steps.current.outputs.current == 'true'
        with:
          context: ${{ steps.extract.outputs.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.description=NInfer, one build for RTX 20, 30, 40 and 50 GPUs together: a layer pipeline across cards of different architectures
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:multi
          cache-to: type=inline
