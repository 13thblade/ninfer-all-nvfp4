name: Native release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Windows and Linux builds as the latest release (master only)
        type: boolean
        default: false

permissions:
  contents: read

# A newer commit cancels old builds. Uploaded sccache entries remain available.
# Publication uses a draft and checks master again before moving latest.
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python3.11 -m unittest discover -s tests/release -v
      - name: Wait for the previous run to finish cache cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3.11 .github/scripts/wait-previous-builds.py

  windows:
    needs: validate
    name: Windows CUDA ${{ matrix.cuda }} (${{ matrix.archs }})
    runs-on: windows-2022
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.9.2'
            archs: '70;75;80;86;89'
            packages: '["nvcc", "cudart", "cublas", "cublas_dev", "nvtx", "thrust", "cuda_profiler_api", "cuobjdump"]'
          - cuda: '13.4.3'
            archs: '75;80;86;89;120a'
            packages: '["nvcc", "crt", "nvvm", "cudart", "cublas", "cublas_dev", "nvtx", "thrust", "cuda_profiler_api", "cuobjdump"]'
    env:
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_LOG: warn
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache-errors.raw.log
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        run: |
          foreach ($path in 'scripts/package-release.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check build cancellation on Windows
        run: python -m unittest discover -s tests/release -p test_build_lifecycle.py -v
      - name: Install the official CUDA Toolkit
        env:
          CUDA_VERSION: ${{ matrix.cuda }}
          CUDA_PACKAGES: ${{ matrix.packages }}
        run: |
          $short = ($env:CUDA_VERSION -split '\.')[0..1] -join '.'
          $installer = Join-Path $env:RUNNER_TEMP 'cuda.exe'
          $url = "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_VERSION/network_installers/cuda_$($env:CUDA_VERSION)_windows_x86_64_network.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $packages = ($env:CUDA_PACKAGES | ConvertFrom-Json) | ForEach-Object { "${_}_$short" }
          $process = Start-Process $installer -ArgumentList (@('-s') + $packages) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "CUDA installer failed ($($process.ExitCode))" }
          $cuda = "${env:ProgramFiles}\NVIDIA GPU Computing Toolkit\CUDA\v$short"
          foreach ($file in 'bin\nvcc.exe', 'bin\cuobjdump.exe', 'include\cuda_runtime.h', 'lib\x64\cublas.lib') {
            if (-not (Test-Path (Join-Path $cuda $file))) { throw "Missing CUDA component: $file" }
          }
          "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
          "$cuda\bin" >> $env:GITHUB_PATH
      - name: Import Visual Studio 2022 environment
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio 2022 x64 tools are missing' }
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vars = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'vcvars64 failed' }
          $vars | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $Matches[1] -notin 'CUDA_PATH', 'VCPKG_ROOT') {
              # GitHub prints exported variables in later step headers. Export only toolchain changes.
              if ($before[$Matches[1]] -cne $Matches[2]) {
                "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
              }
            }
          }
      - id: compiler-cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
          disable_annotations: true
      - name: Verify C++ and multiarch CUDA cache reuse
        timeout-minutes: 10
        env:
          ARCHS: ${{ matrix.archs }}
        run: python .github/scripts/check-compiler-cache.py
      - name: Resolve the pinned vcpkg revision
        id: vcpkg
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          "baseline=$baseline" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg.outputs.baseline }}
          path: .vcpkg
      - uses: actions/cache/restore@v6
        id: dependency-cache
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: windows-release-vcpkg-${{ steps.vcpkg.outputs.baseline }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.cuda }}
          restore-keys: windows-release-vcpkg-${{ steps.vcpkg.outputs.baseline }}-${{ hashFiles('vcpkg.json') }}
      - name: Configure with real FFmpeg and curl libraries
        id: configure
        env:
          ARCHS: ${{ matrix.archs }}
        run: |
          & .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$pwd/.vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_HOST_TRIPLET=x64-windows `
            "-DCMAKE_CUDA_COMPILER=$env:CUDA_PATH/bin/nvcc.exe" `
            "-DCMAKE_CUDA_ARCHITECTURES=$env:ARCHS" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache `
            -DBUILD_TESTING=OFF -DNINFER_BUILD_BENCHMARKS=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
      # Keep completed vcpkg packages even if configuration or NInfer compilation fails.
      - uses: actions/cache/save@v6
        if: always() && steps.configure.outcome != 'skipped' && steps.dependency-cache.outputs.cache-hit != 'true'
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - name: Build release products
        timeout-minutes: 300
        run: python .github/scripts/run-cached-build.py --log build-release/build.log --cache-stats build-release/cache-progress.jsonl -- cmake --build build-release -j --target ninfer ninfer-serve ninfer_bench
      - name: Package, verify device images and test startup without Toolkit on PATH
        run: |
          $env:NINFER_BUILD_ROOT = "$pwd/build-release"
          ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: native-windows-cuda-${{ matrix.cuda }}
          path: |
            dist/*.7z.*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Drain compiler cache
        timeout-minutes: 2
        if: always() && steps.compiler-cache.outcome == 'success'
        run: python .github/scripts/finish-compiler-cache.py --stats build-release/cache-stats.json
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-logs-${{ matrix.cuda }}
          include-hidden-files: true
          path: |
            build-cache-check/cache-stats.json
            build-release/*.log
            build-release/cache-stats.json
            build-release/cache-progress.jsonl
            build-release/CMakeFiles/CMakeConfigureLog.yaml
            build-release/vcpkg-manifest-install.log
            .vcpkg/buildtrees/**/*.log
            dist/*/BUILD-INFO.json
          if-no-files-found: ignore
          retention-days: 7

  linux:
    needs: validate
    name: Linux Debian 13 CUDA ${{ matrix.cuda }} (${{ matrix.archs }})
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.9.2'
            archs: '70;75;80;86;89'
          - cuda: '13.4.3'
            archs: '75;80;86;89;120a'
    defaults:
      run:
        shell: bash
    env:
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_LOG: warn
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache-errors.raw.log
      DEBIAN_FRONTEND: noninteractive
      ARCHS: ${{ matrix.archs }}
      CUDA_VERSION: ${{ matrix.cuda }}
    steps:
      - name: Install checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
      - uses: actions/checkout@v7
      - name: Install Debian build dependencies and official CUDA Toolkit
        run: .github/scripts/install-linux-release-tools.sh
      - id: compiler-cache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
          disable_annotations: true
      - name: Verify C++ and multiarch CUDA cache reuse
        timeout-minutes: 10
        run: python3.11 .github/scripts/check-compiler-cache.py
      - name: Configure release products
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="$ARCHS" -DNINFER_MULTICALL=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache \
            -DBUILD_TESTING=OFF -DNINFER_BUILD_BENCHMARKS=ON
      - name: Build release products
        timeout-minutes: 300
        run: python3.11 .github/scripts/run-cached-build.py --log build-release/build.log --cache-stats build-release/cache-progress.jsonl -- cmake --build build-release -j --target ninfer-multicall ninfer_bench
      - name: Package and verify Linux binaries
        run: NINFER_BUILD_ROOT="$PWD/build-release" scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-cuda-${{ matrix.cuda }}
          path: |
            dist/*.tar.gz.*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Drain compiler cache
        timeout-minutes: 2
        if: always() && steps.compiler-cache.outcome == 'success'
        run: python3.11 .github/scripts/finish-compiler-cache.py --stats build-release/cache-stats.json
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-logs-${{ matrix.cuda }}
          path: |
            build-cache-check/cache-stats.json
            build-release/*.log
            build-release/cache-stats.json
            build-release/cache-progress.jsonl
            build-release/CMakeFiles/CMakeConfigureLog.yaml
            dist/*/BUILD-INFO.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [windows, linux]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Publish verified assets from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-native-release.sh
