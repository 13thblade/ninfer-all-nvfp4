name: Native release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish native release assets and both Docker images (master only)
        type: boolean
        default: false
      platforms:
        description: Platforms to build (publication requires all)
        type: choice
        options: [all, linux, windows]
        default: all
      linux_runner:
        description: Linux runner (the temporary runner must already provide Debian 13)
        type: choice
        options: [github-hosted, ninfer-native-debian13]
        default: github-hosted

permissions:
  contents: read

env:
  HF_BUILD_CACHE_SEED_REF: ${{ vars.HF_BUILD_CACHE_SEED_REF }}

# A newer commit cancels old builds. Cleanup saves completed object-cache entries.
# Publication uses a draft and checks master again before moving latest.
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/build-workflow-checks.yml

  validate:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check publication scope
        env:
          PUBLISH: ${{ inputs.publish }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [[ "$PUBLISH" == true && "$PLATFORMS" != all ]]; then
            echo 'Publication requires both Linux and Windows artifacts.' >&2
            exit 1
          fi
      - name: Wait for the previous run to finish cache cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3.11 .github/scripts/wait-previous-builds.py

  windows-objects:
    needs: validate
    if: inputs.platforms != 'linux'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        toolkit:
          - cuda: '12.9.2'
            archs: '70;75;80;86;89'
            packages: '["nvcc", "cudart", "cublas", "cublas_dev", "nvtx", "thrust", "cuda_profiler_api", "cuobjdump"]'
          - cuda: '13.4.3'
            archs: '75;80;86;89;120a'
            packages: '["nvcc", "crt", "nvvm", "cudart", "cublas", "cublas_dev", "nvtx", "thrust", "cuda_profiler_api", "cuobjdump"]'
    uses: ./.github/workflows/native-windows.yml
    with:
      cuda: ${{ matrix.toolkit.cuda }}
      archs: ${{ matrix.toolkit.archs }}
      packages: ${{ matrix.toolkit.packages }}
      phase: objects
      shard: ${{ matrix.shard }}
    secrets:
      HF_BUILD_CACHE_TOKEN: ${{ secrets.HF_BUILD_CACHE_TOKEN }}

  windows:
    needs: windows-objects
    strategy:
      fail-fast: false
      matrix:
        toolkit:
          - cuda: '12.9.2'
            archs: '70;75;80;86;89'
            packages: '["nvcc", "cudart", "cublas", "cublas_dev", "nvtx", "thrust", "cuda_profiler_api", "cuobjdump"]'
          - cuda: '13.4.3'
            archs: '75;80;86;89;120a'
            packages: '["nvcc", "crt", "nvvm", "cudart", "cublas", "cublas_dev", "nvtx", "thrust", "cuda_profiler_api", "cuobjdump"]'
    uses: ./.github/workflows/native-windows.yml
    with:
      cuda: ${{ matrix.toolkit.cuda }}
      archs: ${{ matrix.toolkit.archs }}
      packages: ${{ matrix.toolkit.packages }}
      phase: package
    secrets:
      HF_BUILD_CACHE_TOKEN: ${{ secrets.HF_BUILD_CACHE_TOKEN }}

  linux:
    needs: validate
    if: inputs.platforms != 'windows'
    name: Linux Debian 13 CUDA ${{ matrix.cuda }} (${{ matrix.archs }})
    runs-on: ${{ inputs.linux_runner == 'ninfer-native-debian13' && 'ninfer-native-debian13' || 'ubuntu-24.04' }}
    container: ${{ inputs.linux_runner != 'ninfer-native-debian13' && 'debian:13-slim' || '' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # The temporary machine uses one workspace and gives each Toolkit all its CPUs.
      max-parallel: ${{ inputs.linux_runner == 'ninfer-native-debian13' && 1 || 2 }}
      matrix:
        include:
          - cuda: '12.9.2'
            archs: '70;75;80;86;89'
          - cuda: '13.4.3'
            archs: '75;80;86;89;120a'
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_BUILD_CACHE_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_CACHE_FAMILY: native-linux-cuda-${{ matrix.cuda }}-host-v2
      CCACHE_DIR: ${{ github.workspace }}/.cache/objects
      CCACHE_MAXSIZE: 8Gi
      CCACHE_COMPILERCHECK: content
      CCACHE_DEPEND: "true"
      CCACHE_COMPRESSLEVEL: "5"
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LC_CTYPE: C.UTF-8
      ARCHS: ${{ matrix.archs }}
      CUDA_VERSION: ${{ matrix.cuda }}
    steps:
      - name: Reserve time for cache upload
        run: echo "BUILD_DEADLINE=$(( $(date +%s) + 19800 ))" >> "$GITHUB_ENV"
      - name: Install checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
      - name: Check the compiler-cache environment
        run: |
          . /etc/os-release
          test "$ID:$VERSION_ID" = debian:13
          test "$GITHUB_WORKSPACE" = /__w/ninfer-all/ninfer-all
      - uses: actions/checkout@v7
      - name: Install Debian build dependencies and official CUDA Toolkit
        run: .github/scripts/install-linux-release-tools.sh
      - id: compiler-cache
        name: Install pinned object cache
        run: python3.11 .github/scripts/install-compiler-cache.py
      - name: Install HF bucket client
        run: python3.11 -m pip install --disable-pip-version-check huggingface_hub==1.17.0
      - name: Restore completed objects from HF
        id: object-cache
        run: python3.11 .github/scripts/hf-build-cache.py restore --directory .cache/objects --family native-linux-cuda-${{ matrix.cuda }}-host-v2 --fallback-family native-linux-cuda-${{ matrix.cuda }}
      - name: Verify object-cache reuse and CUDA invalidation
        timeout-minutes: 10
        run: python3.11 .github/scripts/check-compiler-cache.py
      - name: Configure release products
        run: .github/scripts/configure-linux-build.sh OFF
      - name: Build release products
        id: build
        timeout-minutes: 305
        # The rental exposes all host CPUs, beyond its container CPU and RAM quota.
        run: python3.11 .github/scripts/run-cached-build.py --timeout-seconds 18000 --deadline-env BUILD_DEADLINE --log build-release/build.log --cache-stats build-release/cache-progress.jsonl -- cmake --build build-release -j ${{ inputs.linux_runner == 'ninfer-native-debian13' && 64 || 4 }} --target ninfer-multicall ninfer_bench
      - name: Prepare completed object cache for upload
        timeout-minutes: 2
        if: always() && steps.compiler-cache.outcome == 'success'
        run: python3.11 .github/scripts/finish-compiler-cache.py --stats build-release/cache-stats.json
      - name: Save completed objects even after cancellation
        if: always() && steps.build.outcome != 'skipped' && steps.object-cache.outcome == 'success'
        timeout-minutes: ${{ job.status == 'cancelled' && 3 || 20 }}
        run: python3.11 .github/scripts/hf-build-cache.py save --directory .cache/objects --family native-linux-cuda-${{ matrix.cuda }}-host-v2
      - name: Package and verify Linux binaries
        run: NINFER_BUILD_ROOT="$PWD/build-release" scripts/package-release.sh
      - name: Preserve Linux archive in HF and verify its checksum
        timeout-minutes: 60
        run: python3.11 .github/scripts/archive-linux-artifact.py
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-cuda-${{ matrix.cuda }}
          path: |
            dist/*.tar.gz.*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-logs-${{ matrix.cuda }}
          path: |
            dist/HF-*.json
            build-cache-check/cache-stats.json
            build-release/*.log
            build-release/cache-stats.json
            build-release/cache-progress.jsonl
            build-release/CMakeFiles/CMakeConfigureLog.yaml
            dist/*/BUILD-INFO.json
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Docker images from Linux artifacts
    needs: linux
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      publish: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.publish) }}

  publish:
    needs: [windows, linux]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Publish verified assets from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-native-release.sh
